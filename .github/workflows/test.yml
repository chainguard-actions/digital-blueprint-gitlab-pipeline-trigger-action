name: Test
on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test build & lint

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build & Lint
        run: |
          npm ci
          npm run build
          npm run lint
