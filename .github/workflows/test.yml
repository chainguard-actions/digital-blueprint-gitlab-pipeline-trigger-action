name: Test
on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test build & lint

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build & Lint
        run: |
          npm ci
          npm run build
          npm run lint
