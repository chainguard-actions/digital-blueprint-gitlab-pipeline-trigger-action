name: Test pipeline variables input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "99999999"
          ref: main
          trigger_token: fake-trigger-token-invalid
          variables: '{ "VAR1": "value1", "VAR2": "value2" }'

      - name: Assert action failed at API level (not at variables parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API call (invalid credentials), not at JSON parsing.
          # If it failed at JSON parsing, it would also be 'failure', but the test
          # verifies the action reaches the API call stage (i.e., variables were parsed OK).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at API level), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed variables input and failed at API level"
