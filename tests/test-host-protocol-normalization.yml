name: Test host protocol normalization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that host without protocol prefix is handled (https:// prepended automatically)
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.example.invalid
          id: "12345"
          ref: main
          trigger_token: fake-trigger-token

      - name: Assert action failed gracefully (host without protocol)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should prepend https:// to the host and then fail at the API call
          # (unreachable host), not crash due to missing protocol.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail gracefully with host missing protocol, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly normalized host protocol and failed gracefully"
