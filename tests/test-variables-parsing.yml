name: Test variables JSON parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid variables JSON and invalid credentials
        id: action-with-vars
        uses: .
        continue-on-error: true
        with:
          host: 'gitlab.com'
          id: 'nonexistent-project-99999'
          ref: 'main'
          trigger_token: 'invalid-token'
          variables: '{ "VAR1": "value1", "VAR2": "value2" }'

      - name: Assert action failed due to API error (not JSON parse error)
        run: |
          echo "outcome: ${{ steps.action-with-vars.outcome }}"
          # The action should fail because of invalid credentials (API error),
          # not because of a JSON parsing error. Either way, it should fail.
          if [ "${{ steps.action-with-vars.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was ${{ steps.action-with-vars.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed (variables JSON was parsed, API call failed as expected)"

      - name: Run action with empty variables (default)
        id: action-empty-vars
        uses: .
        continue-on-error: true
        with:
          host: 'gitlab.com'
          id: 'nonexistent-project-99999'
          ref: 'main'
          trigger_token: 'invalid-token'
          variables: '{}'

      - name: Assert action with empty variables also failed due to API error
        run: |
          echo "outcome: ${{ steps.action-empty-vars.outcome }}"
          if [ "${{ steps.action-empty-vars.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was ${{ steps.action-empty-vars.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with empty variables (API error as expected)"
