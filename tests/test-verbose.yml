name: Test verbose mode and custom download path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "12345678"
          ref: develop
          trigger_token: fake-trigger-token
          verbose: "true"
          download_path: "./test-downloads"
      - name: Assert action ran in verbose mode or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
          WEB_URL: ${{ steps.action.outputs.web_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          echo "web_url: $WEB_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: got status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
