name: Test pipeline trigger with verbose mode and custom host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.example.com
          id: "my-group/my-project"
          ref: develop
          trigger_token: fake-trigger-token
          verbose: "true"

      - name: Assert action ran and failed gracefully with custom host and verbose mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
          WEB_URL: ${{ steps.action.outputs.web_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          echo "web_url: $WEB_URL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid credentials/host (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status='$STATUS', web_url='$WEB_URL'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
