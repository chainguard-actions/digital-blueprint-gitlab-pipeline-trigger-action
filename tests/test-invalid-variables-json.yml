name: Test invalid variables JSON input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action calls JSON.parse() on the 'variables' input.
      # Passing invalid JSON should cause the action to fail immediately
      # with a SyntaxError before any network calls are made.
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: 'gitlab.com'
          id: 'test-project'
          ref: 'main'
          trigger_token: 'fake-token'
          variables: 'not-valid-json'

      - name: Assert action failed due to JSON parse error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid JSON variables, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid JSON for variables"
