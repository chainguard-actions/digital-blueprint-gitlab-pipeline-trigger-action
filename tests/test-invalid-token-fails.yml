name: Test invalid trigger token causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "nonexistent-group/nonexistent-project-xyz-12345"
          ref: main
          trigger_token: invalid-fake-token-that-does-not-exist
          verbose: "false"

      - name: Assert action failed with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using an invalid trigger token"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid trigger token"
