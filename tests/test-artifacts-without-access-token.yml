name: Test download_artifacts requires access_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "99999999"
          ref: main
          trigger_token: fake-trigger-token-invalid
          download_artifacts: "true"
          # access_token intentionally omitted to trigger validation error

      - name: Assert action failed due to missing access_token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when download_artifacts=true but no access_token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when access_token is missing for artifact download"
