name: Test custom GitLab host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "mygitlab.example.com"
          id: "my-group/my-project"
          ref: main
          trigger_token: "invalid-token-for-testing"
          variables: '{}'

      - name: Assert action failed (expected — custom host unreachable or invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with custom host and invalid token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using custom host with invalid credentials"
