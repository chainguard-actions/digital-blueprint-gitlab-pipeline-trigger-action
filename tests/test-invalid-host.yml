name: Test invalid host error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          host: 'this-host-does-not-exist.invalid'
          id: 'some-project'
          ref: 'main'
          trigger_token: 'some-token'

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable host, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with unreachable host"
