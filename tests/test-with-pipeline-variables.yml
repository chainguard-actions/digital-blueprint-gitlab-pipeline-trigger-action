name: Test pipeline trigger with variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "99999999"
          ref: main
          trigger_token: "invalid-token-for-testing"
          variables: '{ "VAR1": "value1", "VAR2": "value2" }'

      - name: Assert action failed (expected — invalid token, but variables JSON was valid)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (invalid token), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (variables JSON was valid)"
