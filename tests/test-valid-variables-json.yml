name: Test valid variables JSON input proceeds past parse stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When variables is a valid JSON object, JSON.parse() succeeds and the action
      # proceeds to make a network call to GitLab. Using localhost as the host
      # causes an immediate "connection refused" error (no timeout), so the action
      # fails fast at the network stage rather than at JSON parsing.
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: 'localhost'
          id: 'test-project'
          ref: 'main'
          trigger_token: 'fake-token'
          variables: '{}'

      - name: Assert action failed at network stage (not JSON parse)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (network error with non-routable host), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at network stage when variables JSON is valid"
