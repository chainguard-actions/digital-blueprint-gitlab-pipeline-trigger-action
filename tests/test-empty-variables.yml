name: Test empty variables input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action calls JSON.parse(core.getInput('variables')).
      # When 'variables' is not provided, core.getInput returns an empty string ''.
      # JSON.parse('') throws a SyntaxError, so the action should fail immediately.
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: 'gitlab.com'
          id: 'test-project'
          ref: 'main'
          trigger_token: 'fake-token'
          # 'variables' intentionally omitted — defaults to empty string

      - name: Assert action failed due to empty variables JSON parse error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when variables is empty (JSON.parse('') throws), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when variables input is empty"
