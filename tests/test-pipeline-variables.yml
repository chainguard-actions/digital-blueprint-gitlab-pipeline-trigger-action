name: Test pipeline variables JSON parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          host: gitlab.com
          id: "nonexistent-group/nonexistent-project-xyz-12345"
          ref: main
          trigger_token: invalid-fake-token-that-does-not-exist
          variables: '{ "VAR1": "value1", "VAR2": "value2" }'
          verbose: "false"

      - name: Assert action failed at API call (not at JSON parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API call (invalid token/project),
          # not at JSON parsing (variables are valid JSON).
          # Either way, the outcome should be failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at API call with invalid token)"
            exit 1
          fi
          echo "PASS: action correctly failed (variables JSON was parsed, API call failed as expected)"
